name: lotus
description: "Lotus – Dating-App, die darauf ausgelegt ist, dass Menschen jemanden finden."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
