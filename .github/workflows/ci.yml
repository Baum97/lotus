name: CI

on:
  push:
  pull_request:

# Ältere Läufe desselben Branches abbrechen, sobald neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  database:
    name: Datenbank (Migrationen, Tests, Lasttest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen einspielen und Tests ausführen
        run: scripts/test-db.sh
      - name: Lasttest Vorschläge (10.000 Profile, Grenze 250 ms)
        run: scripts/bench-db.sh 10000 250

  migrations-append-only:
    name: Migrationen nur ergänzen, nie ändern
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bestehende Migrationen unverändert?
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Bereits vorhandene Migrationen wurden geändert. Bitte eine neue Migration anlegen:"
            echo "$changed"
            exit 1
          fi

  functions:
    name: Edge Functions (Format, Lint, Typen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check notify/index.ts verify-purchase/index.ts

  app:
    name: App (Format, Analyse, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Übersetzungen aktuell?
        run: |
          flutter gen-l10n
          dart format lib/l10n/gen
          git diff --exit-code -- lib/l10n/gen
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-Build (APK)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Debug-APK bauen (ohne echte Zugangsdaten)
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_KEY=ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  scripts:
    name: Shell-Skripte (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
